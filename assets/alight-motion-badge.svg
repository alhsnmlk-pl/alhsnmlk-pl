<svg xmlns="http://www.w3.org/2000/svg" width="155" height="28" viewBox="0 0 155 28" role="img" aria-labelledby="title">
  <title>Alight Motion badge</title>
  <rect width="155" height="28" fill="#111827"/>
  
  <!-- Logo Alight Motion - spiral/swirl design dari logo asli -->
  <g transform="translate(12 14) scale(0.022)">
    <!-- Background dark -->
    <circle cx="0" cy="0" r="280" fill="#1E233A"/>
    
    <!-- Main cyan/green swirl paths dari logo asli -->
    <path d="M-120 -80C-80 -120 -40 -140 0 -140C40 -140 80 -120 120 -80C160 -40 180 0 180 40C180 80 160 120 120 160C80 200 40 220 0 220C-40 220 -80 200 -120 160C-160 120 -180 80 -180 40C-180 0 -160 -40 -120 -80Z" 
          fill="none" stroke="#00FDA8" stroke-width="35" opacity="0.99"/>
    
    <!-- Inner swirl -->
    <path d="M-60 -40C-40 -60 -20 -70 0 -70C20 -70 40 -60 60 -40C80 -20 90 0 90 20C90 40 80 60 60 80C40 100 20 110 0 110C-20 110 -40 100 -60 80C-80 60 -90 40 -90 20C-90 0 -80 -20 -60 -40Z" 
          fill="none" stroke="#00FDA8" stroke-width="25" opacity="0.99"/>
    
    <!-- Center highlight -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00FDA8" stroke-width="15" opacity="0.99"/>
  </g>
  
  <text x="32" y="18" fill="#FFFFFF" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="11" font-weight="700">Alight Motion</text>
</svg>
